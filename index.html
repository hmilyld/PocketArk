<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PocketArk</title>
    <script>
      // 主题防闪白：CSS 加载前根据偏好预设 dark / accent-* class 与根字号
      // （与 core/theme 的约定保持一致；默认暗色 = 暗色指挥台基调）
      (function () {
        var m;
        try {
          m = localStorage.getItem('pocketark.theme');
        } catch (e) {}
        if (m !== 'light' && m !== 'dark') m = 'dark';
        if (m === 'dark') document.documentElement.classList.add('dark');
        // 平台层：Windows 覆盖圆角/动效/焦点视觉（见 DESIGN-windows.md）
        try {
          if (/Win/i.test(navigator.platform || navigator.userAgent)) {
            document.documentElement.setAttribute('data-platform', 'win');
          }
        } catch (e) {}
        try {
          var a = localStorage.getItem('pocketark.accent');
          if (a === 'custom') {
            var hex = localStorage.getItem('pocketark.accentCustom') || '#6366f1';
            if (/^#[0-9a-fA-F]{6}$/.test(hex)) {
              var r = parseInt(hex.slice(1, 3), 16);
              var g = parseInt(hex.slice(3, 5), 16);
              var b = parseInt(hex.slice(5, 7), 16);
              var fg = (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.6 ? '#111111' : '#ffffff';
              var st = document.documentElement.style;
              st.setProperty('--primary', hex);
              st.setProperty('--ring', hex);
              st.setProperty('--sidebar-primary', hex);
              st.setProperty('--sidebar-ring', hex);
              st.setProperty('--primary-foreground', fg);
              st.setProperty('--sidebar-primary-foreground', fg);
            }
          } else if (a && a !== 'indigo' && /^[a-z-]+$/.test(a)) {
            document.documentElement.classList.add('accent-' + a);
          }
        } catch (e) {}
        try {
          var f = parseInt(localStorage.getItem('pocketark.fontSize'), 10);
          if (f === 13 || f === 14 || f === 15) {
            document.documentElement.style.setProperty('--app-font-size', f + 'px');
          }
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
